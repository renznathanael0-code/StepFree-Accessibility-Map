<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StepFree – Accessibility Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />


</head>
<body>

    <div id="splash-screen">
        <div class="logo-text">StepFree</div>
        <div id="sync-status">Verbindung wird aufgebaut...</div>
    </div>

<div id="filter-container" style="position:fixed; top:13px; right:12px; z-index:1001; width: 250px;">
<select id="typeFilter" onchange="drawMarkersOnMap()" ...>
    <option value="alle">🌍 Alle Kategorien</option>
    <option value="Kein barrierefreier Zugang">🚫 Kein Zugang</option>
    <option value="Treppe">🪜 Treppen</option>
    <option value="Höhenunterschied">🚉 ⚠️ Stufe am Zug</option>
    <option value="Aufzug defekt">❌ 🛗 Aufzüge defekt</option>
    <option value="Aufzug vorhanden">✅ 🛗 Aufzüge vorhanden</option>
    <option value="Rampe vorhanden">📐 Rampe vorhanden</option>
    <option value="Niveaugleicher Einstieg">🚉 ✅ Einstieg eben</option>
    <option value="Baustelle">🚧 Baustellen</option>
    <option value="WC">🚽 WCs / Toiletten</option>
    <option value="Parkplatz">🅿️ Parkplätze</option>
    <option value="Barrierefreier Ort">📍 Barrierefreie Orte</option>
</select>
</div>


    <div id="map"></div>
    <div id="map-legend" style="position: fixed; bottom: 20px; left: 10px; background: white; padding: 10px; border-radius: 8px; z-index: 1000; box-shadow: 0 0 10px rgba(0,0,0,0.2); font-size: 12px;">
    <strong>Legende</strong><br>
    🚫 Kein barrierefreier Zugang <br>
    🪜 Treppe/Stufe<br>
    🛗 Aufzug Defekt<br>
    ⚠️ Stufe am Zug <br>
    🚧 Baustelle/Sperrung<br>
    🛗 Aufzug vorhanden<br>
    📐 Rampe vorhanden <br>
    ✅ Niveaugleicher Einstieg zum Zug <br>
    🚽 Barrierefreies WC<br>
    🅿️ Behinderten-Parkplatz<br>
    📍 Barrierefreier Ort
</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    
    <script src="script.js"></script>
    </body>
    
    </html>
