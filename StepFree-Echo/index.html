<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barrierefrei-App - Bereich für Sehbehinderte und Blinde</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #FFFFFF; padding: 20px; font-size: 1.2rem; }
        h1, h2 { color: #00FF66; }
        .hidden-accessible { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
        .obstacle-card { background: #1E1E1E; border: 3px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .obstacle-card:focus-within { border-color: #00FF66; background: #252525; }
        .btn-blind { display: block; width: 100%; background: #00FF66; color: black; font-weight: bold; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; margin-top: 10px; cursor: pointer; }
        .btn-blind:focus { outline: 4px solid #FFCC00; }
        .status-bar { background: #222; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Hindernis-Melder (Bereich für Blinde)</h1>
        <p class="hidden-accessible">Navigationshinweis: Nutze die Tab-Taste oder Wischgesten, um durch die Liste der Hindernisse in deiner Umgebung zu navigieren.</p>
    </header>

    <main>
        <div id="live-announcer" class="status-bar" aria-live="assertive" role="status">
            Suche GPS-Standort...
        </div>

        <section aria-label="Aktionen">
            <button class="btn-blind" onclick="openBlindReportForm()">➕ Neues Hindernis melden</button>
        </section>

        <hr style="border: 1px solid #333; margin: 20px 0;">

        <section id="obstacle-list-container" aria-label="Hindernisse in deiner Umgebung">
            <h2>Hindernisse in der Nähe</h2>
            <div id="obstacle-list">
                </div>
        </section>
    </main>

    <script src="../js/app-core.js"></script> 
    <script src="blinde-logic.js"></script>
</body>
</html>
