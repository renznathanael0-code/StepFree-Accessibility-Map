<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SichtAssist - Barrierefreie Assistenz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header role="banner">
        <h1>SichtAssist</h1>
        <p id="appStatus" class="status-box" aria-live="assertive">Tippe auf den Bildschirm, um die App zu starten.</p>
    </header>

    <main role="main">
        <video id="cameraFeed" autoplay playsinline class="video-preview" aria-hidden="true"></video>

        <div class="button-grid" role="region" aria-label="Steuerungsköpfe">
            <button id="btnObstacle" class="btn btn-yellow" aria-label="Hindernisse scannen">
                <span>🚧 Hindernis</span>
            </button>
            <button id="btnTraffic" class="btn btn-green" aria-label="Ampel prüfen">
                <span>🚦 Ampel</span>
            </button>
            <button id="btnText" class="btn btn-blue" aria-label="Text vorlesen">
                <span>📄 Text</span>
            </button>
            <button id="btnColor" class="btn btn-white" aria-label="Farbe erkennen">
                <span>🎨 Farbe</span>
            </button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
